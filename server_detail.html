<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>服务器详情 - Test_Prompt</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <div class="logo">T</div>
      <div class="name">Test_Prompt</div>
    </div>
    <nav class="menu">
      <div class="menu-item menu-l1 open">
        <div class="menu-link">基础信息 <span class="arrow">▶</span></div>
        <div class="menu-item menu-l2 open">
          <div class="menu-link">模型服务器</div>
          <div class="menu-l3">
            <a href="list_server.html" class="active">服务器列表</a>
            <a href="server.html">添加服务器</a>
          </div>
        </div>
        <div class="menu-item menu-l2 open">
          <div class="menu-link">模型</div>
          <div class="menu-l3">
            <a href="mode_list.html">模型列表</a>
            <a href="model_add.html">添加模型</a>
          </div>
        </div>
      </div>
      <div class="menu-item menu-l1">
        <a class="menu-link" href="prompt_dis.html">提示词调试 <span class="arrow">▶</span></a>
      </div>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="eyebrow">基础信息 / 模型服务器 / 详情</div>
        <h1 id="title">服务器详情</h1>
      </div>
      <div class="actions">
        <a class="btn btn-reset" href="list_server.html">返回列表</a>
      </div>
    </div>

    <div class="card">
      <div class="detail-list" id="detail"><!-- JS 渲染 --></div>
    </div>
  </main>

<script src="app.js"></script>
<script>
  const servers = [
    { platform: "OpenAI", company: "美国开放人工智能公司", api: "https://api.openai.com/v1" },
    { platform: "Anthropic", company: "美国 Anthropic 公司", api: "https://api.anthropic.com" },
    { platform: "阿里云通义", company: "阿里巴巴集团", api: "https://dashscope.aliyuncs.com" },
    { platform: "百度文心", company: "百度在线网络技术", api: "https://qianfan.baidubce.com" },
    { platform: "腾讯混元", company: "腾讯科技", api: "https://hunyuan.tencentcloudapi.com" },
    { platform: "字节豆包", company: "北京字节跳动", api: "https://ark.cn-beijing.volces.com" },
    { platform: "智谱 GLM", company: "北京智谱华章", api: "https://open.bigmodel.cn" },
    { platform: "DeepSeek", company: "杭州深度求索", api: "https://api.deepseek.com" }
  ];

  const params = new URLSearchParams(location.search);
  const name = params.get("name") || "";
  const s = servers.find(x => x.platform === name);
  const detail = document.getElementById("detail");

  if (s) {
    document.getElementById("title").textContent = s.platform + " · 详情";
    detail.innerHTML = `
      <div class="detail-item"><div class="detail-key">平台 / 官方名</div><div class="detail-val">${s.platform}</div></div>
      <div class="detail-item"><div class="detail-key">公司名</div><div class="detail-val">${s.company}</div></div>
      <div class="detail-item"><div class="detail-key">api 接口</div><div class="detail-val api-cell">${s.api}</div></div>
      <div class="detail-item"><div class="detail-key">状态</div><div class="detail-val"><span class="badge badge-on">启用</span></div></div>
    `;
  } else {
    document.getElementById("title").textContent = "未找到服务器";
    detail.innerHTML = `<div class="detail-item"><div class="detail-val">未找到名为「${name}」的服务器（原型数据）。</div></div>`;
  }
</script>
</body>
</html>
